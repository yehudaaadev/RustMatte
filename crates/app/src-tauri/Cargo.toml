[package]
name = "rustmatte-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "rustmatte_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
directml = ["rustmatte-core/directml"]
coreml = ["rustmatte-core/coreml"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
rustmatte-core = { path = "../../core" }
tauri = { version = "=2.12.7", features = ["protocol-asset"] }
tauri-plugin-dialog = "=2.8.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
