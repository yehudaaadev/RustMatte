[package]
name = "rustmatte-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = []
directml = ["ort/directml"]
coreml = ["ort/coreml"]

[dependencies]
ort = { version = "=2.0.0-rc.15", features = ["download-binaries", "copy-dylibs", "ndarray"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
heic-rs = "=0.1.5"
ndarray = "0.17.2"
thiserror = "2.0.21"
sha2 = "0.10.8"
ureq = { version = "=2.10.1", default-features = false, features = ["tls", "gzip"] }
dirs = "=6.0.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sysinfo = { version = "=0.40.4", default-features = false, features = ["system", "disk"] }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.15", features = ["directml"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.15", features = ["coreml"] }

[dev-dependencies]
anyhow = "1.0.105"

[[example]]
name = "smoke_inference"
path = "examples/smoke_inference.rs"

[[example]]
name = "bench_matrix"
path = "examples/bench_matrix.rs"
