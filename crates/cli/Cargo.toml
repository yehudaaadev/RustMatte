[package]
name = "rustmatte-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "rustmatte"
path = "src/main.rs"

[features]
default = []
directml = ["rustmatte-core/directml"]
coreml = ["rustmatte-core/coreml"]

[dependencies]
rustmatte-core = { path = "../core" }
clap = { version = "4.5.31", features = ["derive"] }
