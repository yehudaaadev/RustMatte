name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: rustmatte.exe
            archive_ext: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: rustmatte
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: rustmatte
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI in release mode
        run: cargo build --release --bin rustmatte --target ${{ matrix.target }}

      - name: Stage release package
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          PKG_NAME="rustmatte-${TAG_NAME}-${{ matrix.target }}"
          STAGE_DIR="staging/${PKG_NAME}"
          mkdir -p "${STAGE_DIR}"

          # Copy main binary
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${STAGE_DIR}/"

          # On Windows: copy any runtime DLLs generated by ort
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/*.dll "${STAGE_DIR}/" 2>/dev/null || true
          fi

          # Copy documentation and license notices
          cp LICENSE "${STAGE_DIR}/"
          cp README.md "${STAGE_DIR}/"
          cp MODELS.md "${STAGE_DIR}/"

          # Archive
          mkdir -p artifacts
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            (cd staging && 7z a "../artifacts/${PKG_NAME}.zip" "${PKG_NAME}")
          else
            tar -czf "artifacts/${PKG_NAME}.tar.gz" -C staging "${PKG_NAME}"
          fi

          # Checksum
          (cd artifacts && sha256sum * > "${PKG_NAME}.sha256")

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: |
            artifacts/*

  publish-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Consolidated SHA256SUMS
        shell: bash
        run: |
          cd release-assets
          cat *.sha256 | sort -u > SHA256SUMS.txt || sha256sum rustmatte-* > SHA256SUMS.txt
          rm -f *.sha256

      - name: Extract Release Notes from CHANGELOG
        id: release_notes
        shell: bash
        run: |
          if [ -f CHANGELOG.md ]; then
            python3 -c "
          import re
          with open('CHANGELOG.md', 'r') as f:
              content = f.read()
          match = re.search(r'## \[Unreleased\]\n(.*?)(?=\n## |\Z)', content, re.DOTALL)
          if match:
              print(match.group(1).strip())
          else:
              print('RustMatte automated release build.')
          " > notes.md
          else
            echo "RustMatte release." > notes.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          body_path: notes.md
          prerelease: true
          generate_release_notes: true
