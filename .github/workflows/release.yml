name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cli_binary: rustmatte.exe
            archive_ext: zip
            tauri_bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            cli_binary: rustmatte
            archive_ext: tar.gz
            tauri_bundles: dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            cli_binary: rustmatte
            archive_ext: tar.gz
            tauri_bundles: appimage,deb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify version parity
        shell: bash
        run: |
          python3 -c "
          import json, re, pathlib
          cargo_ver = re.search(r'^version\s*=\s*\"([^\"]+)\"', pathlib.Path('Cargo.toml').read_text(), re.M).group(1)
          pkg_ver = json.loads(pathlib.Path('crates/app/package.json').read_text())['version']
          tauri_conf = json.loads(pathlib.Path('crates/app/src-tauri/tauri.conf.json').read_text())
          assert cargo_ver == pkg_ver, f'Version mismatch: Cargo.toml={cargo_ver} vs package.json={pkg_ver}'
          assert 'version' not in tauri_conf or tauri_conf['version'] == cargo_ver, 'tauri.conf.json version mismatch'
          print(f'Version parity verified: {cargo_ver}')
          "

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            pkg-config \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: crates/app/package-lock.json

      - name: Install frontend dependencies
        working-directory: crates/app
        run: npm ci

      - name: Build CLI in release mode
        run: cargo build --release --bin rustmatte --target ${{ matrix.target }}

      - name: Build Desktop App Installer (${{ matrix.tauri_bundles }})
        working-directory: crates/app
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.tauri_bundles }}

      - name: Verify runtime library linkage in CI logs
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            APP_BIN=$(find "target/${{ matrix.target }}/release/bundle/macos" -name "rustmatte-app" -type f | head -n 1)
            echo "=== macOS otool -L ==="
            otool -L "${APP_BIN}"
            echo "=== macOS .app contents ==="
            find "target/${{ matrix.target }}/release/bundle/macos" -maxdepth 4
          elif [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then
            echo "=== Linux ldd ==="
            ldd "target/${{ matrix.target }}/release/rustmatte-app"
            echo "=== Linux bundle files ==="
            find "target/${{ matrix.target }}/release/bundle" -maxdepth 4
          else
            echo "=== Windows release binaries ==="
            ls -la "target/${{ matrix.target }}/release" | head -n 30
          fi

      - name: Verify desktop binary uses custom-protocol instead of devUrl
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            BIN=$(find "target/${{ matrix.target }}/release/bundle/macos" -name "rustmatte-app" -type f | head -n 1)
          elif [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then
            BIN="target/${{ matrix.target }}/release/rustmatte-app"
          else
            BIN="target/${{ matrix.target }}/release/rustmatte-app.exe"
          fi
          BIN_PATH="${BIN}" python3 -c "
          import os, pathlib
          p = pathlib.Path(os.environ['BIN_PATH'])
          assert p.is_file(), f'Missing desktop binary: {p}'
          data = p.read_bytes()
          assert b'RUSTMATTE_BUILD_MODE=custom-protocol' in data, f'Binary {p} is missing custom-protocol build marker'
          assert b'RUSTMATTE_BUILD_MODE=dev-url' not in data, f'Binary {p} depends on devUrl'
          print(f'Verified custom-protocol production build mode in {p}')
          "

      - name: Stage CLI archive and desktop installers
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          PKG_NAME="rustmatte-cli-${TAG_NAME}-${{ matrix.target }}"
          STAGE_DIR="staging/${PKG_NAME}"
          mkdir -p "${STAGE_DIR}" artifacts

          cp "target/${{ matrix.target }}/release/${{ matrix.cli_binary }}" "${STAGE_DIR}/"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/onnxruntime*.dll "${STAGE_DIR}/" 2>/dev/null || true
          fi

          cp LICENSE "${STAGE_DIR}/"
          cp README.md "${STAGE_DIR}/"
          cp MODELS.md "${STAGE_DIR}/"

          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            (cd staging && 7z a "../artifacts/${PKG_NAME}.zip" "${PKG_NAME}")
          else
            tar -czf "artifacts/${PKG_NAME}.tar.gz" -C staging "${PKG_NAME}"
          fi

          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            find "${BUNDLE_DIR}/nsis" -maxdepth 1 -type f -name "*.exe" -exec cp {} artifacts/ \;
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            find "${BUNDLE_DIR}/dmg" -maxdepth 1 -type f -name "*.dmg" -exec cp {} artifacts/ \;
          else
            find "${BUNDLE_DIR}/appimage" -maxdepth 1 -type f -name "*.AppImage" -exec cp {} artifacts/ \;
            find "${BUNDLE_DIR}/deb" -maxdepth 1 -type f -name "*.deb" -exec cp {} artifacts/ \;
          fi

          ls -lh artifacts/
          (cd artifacts && sha256sum * > "${{ matrix.target }}.sha256")

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.target }}
          path: |
            artifacts/*

  publish-release:
    name: Create Draft Prerelease
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Consolidated SHA256SUMS.txt
        shell: bash
        run: |
          cd release-assets
          cat *.sha256 | sort -u > SHA256SUMS.txt
          rm -f *.sha256
          cat SHA256SUMS.txt

      - name: Extract Release Notes from CHANGELOG
        shell: bash
        run: |
          python3 -c "
          import re, pathlib
          content = pathlib.Path('CHANGELOG.md').read_text() if pathlib.Path('CHANGELOG.md').exists() else ''
          match = re.search(r'## \[Unreleased\]\n(.*?)(?=\n## |\Z)', content, re.DOTALL)
          print(match.group(1).strip() if match else 'RustMatte automated release build.')
          " > notes.md

      - name: Create Draft Prerelease
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/*
          body_path: notes.md
          draft: true
          prerelease: true
          generate_release_notes: true
