name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify version parity
        shell: bash
        run: |
          python3 -c "
          import json, re, pathlib
          cargo_ver = re.search(r'^version\s*=\s*\"([^\"]+)\"', pathlib.Path('Cargo.toml').read_text(), re.M).group(1)
          pkg_ver = json.loads(pathlib.Path('crates/app/package.json').read_text())['version']
          tauri_conf = json.loads(pathlib.Path('crates/app/src-tauri/tauri.conf.json').read_text())
          assert cargo_ver == pkg_ver, f'Version mismatch: Cargo.toml={cargo_ver} vs package.json={pkg_ver}'
          assert 'version' not in tauri_conf or tauri_conf['version'] == cargo_ver, 'tauri.conf.json version mismatch'
          print(f'Version parity verified: {cargo_ver}')
          "

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies and build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run clippy linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run test suite
        run: cargo test --workspace --verbose

      - name: Build workspace binaries
        run: cargo build --workspace --verbose

  audit:
    name: License and Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories

  frontend:
    name: Frontend Check, Build, and License Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: crates/app/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Check npm licenses
        run: npm run license-check && npm run license-check:all

      - name: Run frontend unit tests
        run: npm test

      - name: Type-check Svelte frontend
        run: npm run check

      - name: Build static frontend
        run: npm run build
